# JitsiMap — app-only deployment (SPEC §12.4).
#
# Default: app container pointed at an EXISTING Jitsi deployment
# (self-hosted docker-jitsi-meet, JaaS, or any lib-jitsi-meet-compatible
# stack). Only JITSI_DOMAIN & friends change between deployments.
#
# Full mode (app + pinned Jitsi stack on one host):
#   docker compose -f docker-compose.yml -f docker-compose.jitsi.yml --profile full up -d
# See README §Full mode for prerequisites (TLS/domain, gen-passwords.sh).

services:
  app:
    build: .
    image: jitsimap:latest
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      JITSI_DOMAIN: "${JITSI_DOMAIN:?set to your Jitsi domain, e.g. meet.example.org}"
      JITSI_XMPP_DOMAIN: "${JITSI_XMPP_DOMAIN:-${JITSI_DOMAIN}}"
      JITSI_MUC_DOMAIN: "${JITSI_MUC_DOMAIN:-conference.${JITSI_DOMAIN}}"
      JITSI_WEBSOCKET_URL: "${JITSI_WEBSOCKET_URL:-wss://${JITSI_DOMAIN}/xmpp-websocket}"
      JITSI_BOSH_URL: "${JITSI_BOSH_URL:-https://${JITSI_DOMAIN}/http-bind}"
      JITSI_APP_ID: "${JITSI_APP_ID:-}"
      JITSI_AUTH_MODE: "${JITSI_AUTH_MODE:-anonymous}"  # anonymous | jwt-guest | jwt-token
      JITSI_TOKEN_PARAM: "${JITSI_TOKEN_PARAM:-jwt}"
      DEFAULT_MAP: "${DEFAULT_MAP:-office}"
    volumes:
      # Runtime maps (README §Maps): files here are merged into /maps/ at
      # container start. Drop <id>.tmj (+ tilesets/<file>.png) into
      # ./maps-extra (default) and join with /s/<space>?map=<id>.
      - "${MAPS_EXTRA_DIR:-./maps-extra}:/opt/maps-extra:ro"
    restart: unless-stopped
